# CI en cada pull request; al fusionar en main: imágenes a GHCR y despliegue en el VPS por SSH.
#
# Seguridad para un repo abierto:
#  - Los PR (también de forks) corren SIN secretos y con permisos de solo lectura.
#  - Publicar y desplegar solo ocurre en `push` a main (tras revisión y CI verde).
#  - Nunca se usa `pull_request_target`.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API · tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acopio
          POSTGRES_PASSWORD: acopio
          POSTGRES_DB: acopio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U acopio -d acopio_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://acopio:acopio@localhost:5432/acopio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w apps/api
      - run: npm run build -w apps/api
      - run: npm test -w apps/api

  web:
    name: Web · tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w apps/web
      - run: npm run build -w apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  lint:
    name: Lint y formato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  audit:
    name: Dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Lo que llega a producción bloquea; las herramientas de desarrollo (ESLint, Prettier…) solo avisan,
      # porque sus avisos no afectan al sitio y a veces no tienen versión corregida. Dependabot las sigue.
      - name: Dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: Dependencias de desarrollo (informativo)
        continue-on-error: true
        run: npm audit --audit-level=high

  images:
    name: Imágenes Docker (${{ matrix.name }})
    # Sin `needs`: corre en paralelo con las pruebas. En main solo publica la etiqueta sha-…, que nadie
    # usa hasta que `deploy` (que sí espera a las pruebas) la despliega y la marca como `latest`.
    # El VPS es ARM64 (Hetzner CAX), así que las imágenes se construyen en runners ARM nativos
    # (gratis en repos públicos): sin emulación y mucho más rápido que QEMU para `next build`.
    # Si algún día el servidor es amd64, cambia `runs-on` y `platforms` aquí.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            context: .
          - name: web
            dockerfile: apps/web/Dockerfile
            context: .
          - name: backup
            dockerfile: deploy/backup/Dockerfile
            context: deploy/backup
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Versión (package.json + commit)
        run: echo "value=$(node -p "require('./package.json').version")+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/acopiospanama-${{ matrix.name }}
          tags: type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          # En PR solo se construye (verifica que el Dockerfile funciona); en main se publica.
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.name }}
          # Exportar la caché cuesta más que el propio build (~80 s la web), y la de un PR queda limitada a
          # su rama: solo main la escribe y los PR la leen.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}

  deploy:
    name: Desplegar en el VPS
    needs: [api, web, lint, audit, images]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Entorno con protección opcional (revisores obligatorios) en Settings › Environments.
    # Los secretos y variables DEPLOY_* viven en ese entorno: solo main puede usarlos.
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::warning::Faltan DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS: las imágenes se publicaron, pero no se desplegó."
            echo "omitir=1" >> "$GITHUB_ENV"; exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n' \
            "${{ vars.DEPLOY_HOST }}" "${{ vars.DEPLOY_USER }}" > ~/.ssh/config
      - name: Copiar compose, Caddyfile y script
        if: env.omitir != '1'
        run: |
          scp -q docker-compose.yml vps:/opt/acopiospanama/docker-compose.yml
          scp -q deploy/Caddyfile deploy/desplegar.sh vps:/opt/acopiospanama/deploy/
      - name: Actualizar contenedores
        if: env.omitir != '1'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh vps \
            "GHCR_USER='${{ github.actor }}' IMAGE_TAG='sha-${{ github.sha }}' bash /opt/acopiospanama/deploy/desplegar.sh"
      - name: Verificar que responde
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then echo "Sin PUBLIC_URL (variable del repo): se omite la verificación."; exit 0; fi
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 10 "$PUBLIC_URL/api/health" > /dev/null; then echo "OK"; exit 0; fi
            sleep 10
          done
          echo "::error::$PUBLIC_URL/api/health no respondió en 5 minutos"; exit 1
      - name: Marcar las imágenes desplegadas como latest
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for name in api web backup; do
            img="ghcr.io/$OWNER/acopiospanama-$name"
            docker buildx imagetools create -t "$img:latest" "$img:sha-$GITHUB_SHA"
          done
