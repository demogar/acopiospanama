# Versionado y publicaciones automáticas (SemVer) a partir de los commits en main.
#
#  - release-please mantiene un PR «chore(release): vX.Y.Z» con el CHANGELOG y las versiones de package.json.
#  - Al fusionar ese PR crea la etiqueta vX.Y.Z y la publicación en GitHub.
#  - Después, las imágenes sha-… que CI/CD publica para ese commit reciben también la etiqueta vX.Y.Z.
#
# Con el GITHUB_TOKEN, el PR de release no dispara la CI (limitación de GitHub). Para que sí lo haga,
# guarda un token personal (fine-grained: contents y pull-requests en escritura) en el secreto RELEASE_PLEASE_TOKEN.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    name: Etiquetar imágenes con la versión
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Esperar a CI/CD y añadir la etiqueta ${{ needs.release-please.outputs.tag_name }}
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for name in api web backup; do
            img="ghcr.io/$OWNER/acopiospanama-$name"
            for i in $(seq 1 60); do
              docker buildx imagetools inspect "$img:sha-$GITHUB_SHA" > /dev/null 2>&1 && break
              [ "$i" = 60 ] && { echo "::error::$img:sha-$GITHUB_SHA no apareció en 20 minutos"; exit 1; }
              sleep 20
            done
            docker buildx imagetools create -t "$img:$TAG" "$img:sha-$GITHUB_SHA"
            echo "$img:$TAG"
          done
